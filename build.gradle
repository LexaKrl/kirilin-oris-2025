plugins {
    id 'java'
    id 'war'
    id 'application'
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = "com.kirilin"
version = "1.0-SNAPSHOT"

ext {
    springVersion = '6.2.3'
    springSecurityVersion = '6.4.4'
    jakartaVersion = '6.1.0'
    hibernateVersion = '6.5.2.Final'
    postgresVersion = '42.7.5'
}

repositories {
    mavenLocal()
    mavenCentral()
}

application {
    mainClass = "com.kirilin.Main"
}

dependencies {
    implementation "org.springframework:spring-webmvc:$springVersion"
    implementation "org.springframework:spring-jdbc:$springVersion"
    implementation "org.springframework:spring-orm:$springVersion"
    implementation "org.springframework:spring-context-support:$springVersion"
    implementation "org.springframework.security:spring-security-core:$springSecurityVersion"
    implementation "org.springframework.security:spring-security-web:$springSecurityVersion"
    implementation "org.springframework.security:spring-security-config:$springSecurityVersion"
    implementation "org.springframework.security:spring-security-taglibs:$springSecurityVersion"
    implementation "jakarta.servlet:jakarta.servlet-api:$jakartaVersion"
    implementation "org.hibernate:hibernate-core:$hibernateVersion"
    implementation "org.postgresql:postgresql:$postgresVersion"
    implementation "com.mchange:c3p0:0.10.2"
    implementation "org.springframework.data:spring-data-jpa:3.4.4"
    implementation "org.freemarker:freemarker:2.3.34"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.3"
    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"
}

allprojects {
    group = 'com.technokratos'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'idea'
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    ext {
        lombokVersion = '1.18.38'
    }

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    bootJar.archiveFileName = "${project.name}.jar"

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }
}